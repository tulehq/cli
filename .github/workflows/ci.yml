name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Unit tests
        run: make test

      - name: Parity with console's compose.yaml
        # Compares the catalog with console's compose.yaml at the console
        # release whose pins this catalog ships.
        env:
          CONSOLE_REF: v0.3.10
        shell: bash
        run: |
          compose="$RUNNER_TEMP/console-compose.yaml"
          curl -fsSL -o "$compose" \
            "https://raw.githubusercontent.com/tulehq/console/$CONSOLE_REF/compose.yaml"
          TULE_CONSOLE_COMPOSE="$compose" go test -count=1 -v \
            -run '^TestParityWithConsoleCompose$' ./internal/render/ \
            | tee "$RUNNER_TEMP/parity.out"
          # A skip or a test renamed out of -run would pass silently.
          grep -q '^--- PASS: TestParityWithConsoleCompose' "$RUNNER_TEMP/parity.out"

      - name: Build
        run: make build

  e2e:
    # Stacks from the released images on the runner's Docker daemon, with
    # AWS SDK clients against them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Docker Compose version
        run: docker compose version

      - name: End to end
        run: make test-e2e

  spike:
    # Not a required check. It asks two questions of the runner's native
    # Linux Docker and logs the answers as FINDING lines; it fails only when
    # it could not ask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Spike
        run: make test-spike
