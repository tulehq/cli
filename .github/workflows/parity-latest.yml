name: Parity with the latest console

# Daily, and not a required check: compares the catalog with the compose.yaml
# of console's latest release, so a catalog that falls behind a console
# release is caught. The required parity step in CI stays pinned to a commit.
#
# It fails until the next console release: v0.3.8, the latest today, predates
# the compose change that gives secret-store TULE_Store_FunctionsEndpoint,
# which the catalog has.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Parity with console's latest release
        shell: bash
        run: |
          # Release tags only, sorted by version, so v0.3.10 is after v0.3.9.
          tag=$(git ls-remote --tags --refs https://github.com/tulehq/console.git \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "no console release tag found" >&2
            exit 1
          fi
          echo "console $tag"
          compose="$RUNNER_TEMP/console-compose.yaml"
          curl -fsSL -o "$compose" \
            "https://raw.githubusercontent.com/tulehq/console/$tag/compose.yaml"
          TULE_CONSOLE_COMPOSE="$compose" go test -count=1 -v \
            -run '^TestParityWithConsoleCompose$' ./internal/render/ \
            | tee "$RUNNER_TEMP/parity.out"
          # A skip or a test renamed out of -run would pass silently.
          grep -q '^--- PASS: TestParityWithConsoleCompose' "$RUNNER_TEMP/parity.out"
